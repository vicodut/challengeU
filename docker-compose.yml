services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-challengeu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-challengeu}
      POSTGRES_DB: ${DB_NAME:-challengeu_dev}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-challengeu} -d ${DB_NAME:-challengeu_dev}']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
